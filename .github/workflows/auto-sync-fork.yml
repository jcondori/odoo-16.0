name: Auto Sync Fork

on:
  schedule:
    - cron: "0 5 * * *" # Todos los días a 00:00 -05 (Perú)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ['16.0', '18.0', '19.0']
    steps:
      - name: Sync ${{ matrix.branch }} con odoo/odoo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -uo pipefail
          if resp=$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch="$BRANCH" 2>&1); then
            type=$(jq -r '.merge_type // "?"' <<<"$resp")
            echo "✅ **$BRANCH**: $type" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **$BRANCH**: $resp" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Sync $BRANCH falló::$resp"
            exit 1
          fi
